<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Proteção de verdade</title>
  <desc id="d">Device Owner: não desinstala, VPN travada no Tailscale e regras que só o admin, com senha, pode tirar.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .shackle { animation: lock 4s cubic-bezier(.5,0,.2,1.4) infinite; }
      @keyframes lock { 0%,15% { transform: translate(10px,-16px) } 35%,85% { transform: none } 100% { transform: translate(10px,-16px) } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 4s ease-out infinite; }
      @keyframes ring { 0%,30% { transform: scale(.8); opacity: 0 } 36% { opacity: .7 } 70%,100% { transform: scale(1.5); opacity: 0 } }
      .row { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
      .r1 { animation-delay: .2s } .r2 { animation-delay: .35s } .r3 { animation-delay: .5s }
      @keyframes in { from { opacity: 0; transform: translateX(12px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { .shackle, .ring { animation: none } .row { animation: none } }
    </style>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34E37A"/><stop offset="1" stop-color="#1A9C4E"/></linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="card"><rect width="640" height="420" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="420" fill="#0B0B10"/>
    <g filter="url(#blur)"><circle cx="150" cy="290" r="130" fill="#30D158" opacity=".35"/></g>
    <g class="sans">
      <text x="40" y="66" font-size="15" font-weight="700" fill="#4CE08A" letter-spacing=".4">PROTEÇÃO</text>
      <text x="40" y="104" font-size="32" font-weight="800" letter-spacing="-1" fill="#fff">Difícil de burlar.</text>
      <text x="40" y="136" font-size="17" fill="#fff" fill-opacity=".62">Sem a senha do admin, as regras ficam.</text>
    </g>

    <!-- Escudo com cadeado -->
    <circle class="ring" cx="150" cy="282" r="70" fill="none" stroke="#30D158" stroke-width="3"/>
    <path d="M150 196l72 26v52c0 46-32 78-72 92-40-14-72-46-72-92v-52z" fill="url(#shield)"/>
    <path d="M150 196l72 26v52c0 46-32 78-72 92" fill="#000" fill-opacity=".12"/>
    <rect x="124" y="270" width="52" height="40" rx="9" fill="#fff"/>
    <circle cx="150" cy="287" r="5" fill="#1A9C4E"/>
    <rect x="148" y="288" width="4" height="10" rx="2" fill="#1A9C4E"/>
    <g class="shackle"><path d="M134 271v-12a16 16 0 0 1 32 0v12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>

    <g class="sans" font-size="17">
      <g class="row r1">
        <rect x="280" y="194" width="320" height="58" rx="16" fill="#fff" fill-opacity=".06"/>
        <text x="302" y="219" font-weight="700" fill="#fff">Não desinstala</text>
        <text x="302" y="240" font-size="14" fill="#fff" fill-opacity=".55">Device Owner, sem reset pelas Configurações</text>
      </g>
      <g class="row r2">
        <rect x="280" y="262" width="320" height="58" rx="16" fill="#fff" fill-opacity=".06"/>
        <text x="302" y="287" font-weight="700" fill="#fff">VPN travada</text>
        <text x="302" y="308" font-size="14" fill="#fff" fill-opacity=".55">Tailscale sempre ligado, com failover</text>
      </g>
      <g class="row r3">
        <rect x="280" y="330" width="320" height="58" rx="16" fill="#fff" fill-opacity=".06"/>
        <text x="302" y="355" font-weight="700" fill="#fff">Admin com senha</text>
        <text x="302" y="376" font-size="14" fill="#fff" fill-opacity=".55">PBKDF2 + código de recuperação</text>
      </g>
    </g>
    <rect x=".75" y=".75" width="638.5" height="418.5" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
  </g>
</svg>
