<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Foco com cronômetro</title>
  <desc id="d">Modos Parcial, Total e Bloquear. Ao começar, o cronômetro aparece na Now Bar e não dá para trocar de modo.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .num { font-variant-numeric: tabular-nums; }
      .arc { stroke-dasharray: 503 503; animation: arc 10s linear infinite; }
      @keyframes arc { from { stroke-dashoffset: 120 } to { stroke-dashoffset: 140 } }
      .tick { opacity: 0; animation: tick 10s steps(1) infinite; }
      @keyframes tick { 0% { opacity: 1 } 10%,100% { opacity: 0 } }
      .t0 { animation-delay: 0s } .t1 { animation-delay: 1s } .t2 { animation-delay: 2s } .t3 { animation-delay: 3s } .t4 { animation-delay: 4s }
      .t5 { animation-delay: 5s } .t6 { animation-delay: 6s } .t7 { animation-delay: 7s } .t8 { animation-delay: 8s } .t9 { animation-delay: 9s }
      .bar { animation: drop 1s cubic-bezier(.2,.9,.25,1.2) both; transform-box: fill-box; transform-origin: center top; }
      @keyframes drop { from { transform: translateY(-30px) scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
      .glow { animation: glow 3s ease-in-out infinite alternate; }
      @keyframes glow { from { opacity: .35 } to { opacity: .6 } }
      @media (prefers-reduced-motion: reduce) { .arc, .glow, .bar { animation: none } .tick { animation: none } .t0 { opacity: 1 } }
    </style>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="card"><rect width="640" height="420" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="420" fill="#0B0B10"/>
    <g filter="url(#blur)"><circle class="glow" cx="470" cy="260" r="170" fill="#BF5AF2"/></g>
    <g class="sans">
      <text x="40" y="66" font-size="15" font-weight="700" fill="#D18BF7" letter-spacing=".4">FOCO</text>
      <text x="40" y="104" font-size="32" font-weight="800" letter-spacing="-1" fill="#fff">Começou, não volta atrás.</text>
      <text x="40" y="136" font-size="17" fill="#fff" fill-opacity=".62">Cronômetro na Now Bar. Só o admin encerra antes.</text>
    </g>

    <!-- Modos -->
    <g class="sans" font-size="16" font-weight="600">
      <rect x="40" y="186" width="200" height="56" rx="18" fill="#fff" fill-opacity=".06"/>
      <circle cx="68" cy="214" r="12" fill="#8E8E93" fill-opacity=".45"/>
      <text x="92" y="220" fill="#fff" fill-opacity=".75">Parcial</text>
      <rect x="40" y="252" width="200" height="56" rx="18" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
      <circle cx="68" cy="280" r="12" fill="#fff"/>
      <path d="M62 280h12" stroke="#0B0B10" stroke-width="2.6" stroke-linecap="round"/>
      <text x="92" y="286" fill="#fff">Total</text>
      <rect x="40" y="318" width="200" height="56" rx="18" fill="#fff" fill-opacity=".06"/>
      <circle cx="68" cy="346" r="12" fill="#8E8E93" fill-opacity=".45"/>
      <rect x="63" y="345" width="10" height="7" rx="1.5" fill="#fff"/>
      <path d="M65 345v-3a3 3 0 0 1 6 0v3" fill="none" stroke="#fff" stroke-width="1.6"/>
      <text x="92" y="352" fill="#fff" fill-opacity=".75">Bloquear</text>
    </g>

    <!-- Now Bar -->
    <g class="bar">
      <rect x="300" y="178" width="300" height="46" rx="23" fill="#000" stroke="#fff" stroke-opacity=".14"/>
      <circle cx="324" cy="201" r="12" fill="#BF5AF2"/>
      <path d="M318 201h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <text class="sans" x="346" y="207" font-size="15" font-weight="700" fill="#fff">Foco total</text>
      <g class="sans num" font-size="15" font-weight="700" fill="#D18BF7" text-anchor="end">
        <text class="tick t0" x="584" y="207">24:59</text><text class="tick t1" x="584" y="207">24:58</text>
        <text class="tick t2" x="584" y="207">24:57</text><text class="tick t3" x="584" y="207">24:56</text>
        <text class="tick t4" x="584" y="207">24:55</text><text class="tick t5" x="584" y="207">24:54</text>
        <text class="tick t6" x="584" y="207">24:53</text><text class="tick t7" x="584" y="207">24:52</text>
        <text class="tick t8" x="584" y="207">24:51</text><text class="tick t9" x="584" y="207">24:50</text>
      </g>
    </g>

    <!-- Cronômetro -->
    <g transform="translate(450 310) rotate(-90)">
      <circle r="80" fill="none" stroke="#BF5AF2" stroke-opacity=".2" stroke-width="10"/>
      <circle class="arc" r="80" fill="none" stroke="#BF5AF2" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g class="sans num" text-anchor="middle" fill="#fff" font-size="40" font-weight="300" letter-spacing="-1">
      <text class="tick t0" x="450" y="318">24:59</text><text class="tick t1" x="450" y="318">24:58</text>
      <text class="tick t2" x="450" y="318">24:57</text><text class="tick t3" x="450" y="318">24:56</text>
      <text class="tick t4" x="450" y="318">24:55</text><text class="tick t5" x="450" y="318">24:54</text>
      <text class="tick t6" x="450" y="318">24:53</text><text class="tick t7" x="450" y="318">24:52</text>
      <text class="tick t8" x="450" y="318">24:51</text><text class="tick t9" x="450" y="318">24:50</text>
    </g>
    <text class="sans" x="450" y="346" text-anchor="middle" font-size="13" fill="#fff" fill-opacity=".55">até 15:30</text>
    <rect x=".75" y=".75" width="638.5" height="418.5" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
  </g>
</svg>
