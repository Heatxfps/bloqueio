<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Cotas que entendem a tela</title>
  <desc id="d">Anel duplo das cotas. Só Reels e Shorts descontam; feed, Direct e busca não contam.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .rs { stroke-dasharray: 440 440; animation: rs 8s cubic-bezier(.6,0,.2,1) infinite; }
      .rg { stroke-dasharray: 327 327; animation: rg 8s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes rs { 0% { stroke-dashoffset: 440 } 20%,45% { stroke-dashoffset: 0 } 80%,100% { stroke-dashoffset: 170 } }
      @keyframes rg { 0%,5% { stroke-dashoffset: 327 } 25%,100% { stroke-dashoffset: 95 } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .45 } }
      .row { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
      .r1 { animation-delay: .2s } .r2 { animation-delay: .35s } .r3 { animation-delay: .5s } .r4 { animation-delay: .65s }
      @keyframes in { from { opacity: 0; transform: translateX(12px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { .rs, .rg, .pulse { animation: none } .rs { stroke-dashoffset: 170 } .rg { stroke-dashoffset: 95 } .row { animation: none } }
    </style>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="card"><rect width="640" height="420" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="420" fill="#0B0B10"/>
    <g filter="url(#blur)"><circle cx="120" cy="300" r="150" fill="#FF375F" opacity=".45"/><circle cx="250" cy="380" r="110" fill="#5E5CE6" opacity=".45"/></g>
    <g class="sans">
      <text x="40" y="66" font-size="15" font-weight="700" fill="#FF6B86" letter-spacing=".4">COTAS</text>
      <text x="40" y="104" font-size="32" font-weight="800" letter-spacing="-1" fill="#fff">Só Reels e Shorts contam.</text>
      <text x="40" y="136" font-size="17" fill="#fff" fill-opacity=".62">Acabou a cota? Só eles somem. O resto do app continua.</text>
    </g>
    <g transform="translate(150 280) rotate(-90)">
      <circle r="70" fill="none" stroke="#FF375F" stroke-opacity=".22" stroke-width="18"/>
      <circle class="rs" r="70" fill="none" stroke="#FF375F" stroke-width="18" stroke-linecap="round"/>
      <circle r="52" fill="none" stroke="#5E5CE6" stroke-opacity=".25" stroke-width="18"/>
      <circle class="rg" r="52" fill="none" stroke="#5E5CE6" stroke-width="18" stroke-linecap="round"/>
    </g>
    <g class="sans" font-size="17">
      <g class="row r1">
        <rect x="270" y="186" width="330" height="44" rx="14" fill="#fff" fill-opacity=".06"/>
        <circle class="pulse" cx="292" cy="208" r="6" fill="#FF375F"/>
        <text x="310" y="214" font-weight="600" fill="#fff">Reels (Insta e Facebook)</text>
        <text x="584" y="214" text-anchor="end" fill="#FF6B86" font-weight="700">conta</text>
      </g>
      <g class="row r2">
        <rect x="270" y="238" width="330" height="44" rx="14" fill="#fff" fill-opacity=".06"/>
        <circle class="pulse" cx="292" cy="260" r="6" fill="#FF375F"/>
        <text x="310" y="266" font-weight="600" fill="#fff">Shorts do YouTube</text>
        <text x="584" y="266" text-anchor="end" fill="#FF6B86" font-weight="700">conta</text>
      </g>
      <g class="row r3">
        <rect x="270" y="290" width="330" height="44" rx="14" fill="#fff" fill-opacity=".06"/>
        <path d="M286 312l5 5 9-10" fill="none" stroke="#30D158" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="310" y="318" fill="#fff" fill-opacity=".8">Feed, Direct, busca, perfil</text>
        <text x="584" y="318" text-anchor="end" fill="#fff" fill-opacity=".5">livre</text>
      </g>
      <g class="row r4">
        <rect x="270" y="342" width="330" height="44" rx="14" fill="#fff" fill-opacity=".06"/>
        <path d="M286 364l5 5 9-10" fill="none" stroke="#30D158" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="310" y="370" fill="#fff" fill-opacity=".8">Gaveta ou tela travada</text>
        <text x="584" y="370" text-anchor="end" fill="#fff" fill-opacity=".5">pausa</text>
      </g>
    </g>
    <rect x=".75" y=".75" width="638.5" height="418.5" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
  </g>
</svg>
