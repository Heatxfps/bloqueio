<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Bloqueio</title>
  <desc id="d">Autocontrole de verdade para Android: cotas de Reels e Shorts, foco com cronômetro, descanso noturno e proteção que não se desinstala.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .breathe-a { animation: breatheA 7s ease-in-out infinite alternate; transform-origin: 300px 200px; }
      .breathe-b { animation: breatheB 8s ease-in-out infinite alternate; transform-origin: 1000px 470px; }
      @keyframes breatheA { from { transform: scale(.92); opacity: .75 } to { transform: scale(1.08); opacity: 1 } }
      @keyframes breatheB { from { transform: scale(1.06); opacity: 1 } to { transform: scale(.9); opacity: .7 } }
      .ring-s { stroke-dasharray: 597 597; animation: drainS 9s cubic-bezier(.6,0,.2,1) infinite; }
      .ring-g { stroke-dasharray: 452 452; animation: drainG 9s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes drainS { 0% { stroke-dashoffset: 597 } 22% { stroke-dashoffset: 0 } 60% { stroke-dashoffset: 0 } 85%,100% { stroke-dashoffset: 228 } }
      @keyframes drainG { 0%,6% { stroke-dashoffset: 452 } 28% { stroke-dashoffset: 0 } 64% { stroke-dashoffset: 0 } 88%,100% { stroke-dashoffset: 270 } }
      .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s } .d5 { animation-delay: .7s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .float { animation: float 6s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(-6px) } to { transform: translateY(6px) } }
      .shine { animation: shine 5s ease-in-out infinite; }
      @keyframes shine { 0%,55% { transform: translateX(-420px) } 100% { transform: translateX(420px) } }
      @media (prefers-reduced-motion: reduce) {
        .breathe-a, .breathe-b, .float, .shine { animation: none }
        .ring-s { animation: none; stroke-dashoffset: 228 } .ring-g { animation: none; stroke-dashoffset: 270 }
        .rise { animation: none }
      }
    </style>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1280" height="640"/></clipPath>
    <clipPath id="phoneClip"><rect x="846" y="70" width="300" height="520" rx="46"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
  <rect width="1280" height="640" fill="#07070B"/>
  <!-- Aura das cotas -->
  <g filter="url(#blur)">
    <circle class="breathe-a" cx="300" cy="200" r="230" fill="#FF375F" opacity=".55"/>
    <circle class="breathe-b" cx="1000" cy="470" r="250" fill="#5E5CE6" opacity=".6"/>
    <circle cx="760" cy="90" r="140" fill="#BF5AF2" opacity=".25"/>
  </g>
  <rect width="1280" height="640" fill="#07070B" opacity=".35"/>

  <!-- Texto -->
  <g class="sans">
    <g class="rise d1">
      <rect x="96" y="150" width="190" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/>
      <circle cx="118" cy="168" r="5" fill="#30D158"/>
      <text x="132" y="174" font-size="16" font-weight="600" fill="#fff" fill-opacity=".85">Android · código aberto</text>
    </g>
    <text class="rise d2" x="92" y="282" font-size="104" font-weight="800" letter-spacing="-4" fill="#fff">Bloqueio</text>
    <text class="rise d3" x="96" y="336" font-size="30" font-weight="500" letter-spacing="-.5" fill="#fff" fill-opacity=".78">Autocontrole de verdade para o seu celular.</text>
    <g class="rise d4" font-size="19" font-weight="600" fill="#fff">
      <rect x="96" y="380" width="262" height="44" rx="22" fill="#FF375F" fill-opacity=".18" stroke="#FF375F" stroke-opacity=".55"/>
      <text x="118" y="408">Reels e Shorts com cota</text>
      <rect x="370" y="380" width="206" height="44" rx="22" fill="#BF5AF2" fill-opacity=".18" stroke="#BF5AF2" stroke-opacity=".55"/>
      <text x="392" y="408">Foco na Now Bar</text>
      <rect x="96" y="436" width="212" height="44" rx="22" fill="#5E5CE6" fill-opacity=".2" stroke="#5E5CE6" stroke-opacity=".6"/>
      <text x="118" y="464">Descanso noturno</text>
      <rect x="320" y="436" width="268" height="44" rx="22" fill="#30D158" fill-opacity=".14" stroke="#30D158" stroke-opacity=".5"/>
      <text x="342" y="464">Não dá para desinstalar</text>
    </g>
    <text class="rise d5" x="96" y="540" font-size="17" fill="#fff" fill-opacity=".5">Device Owner · VPN travada · Senha de admin · Sem anúncios, sem contas, sem servidor</text>
  </g>

  <!-- Celular -->
  <g class="float">
    <rect x="840" y="64" width="312" height="532" rx="52" fill="#000" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <g clip-path="url(#phoneClip)">
      <rect x="846" y="70" width="300" height="520" fill="#0B0B10"/>
      <g filter="url(#blur)" opacity=".9">
        <circle cx="900" cy="190" r="110" fill="#FF375F" opacity=".5"/>
        <circle cx="1110" cy="250" r="110" fill="#5E5CE6" opacity=".55"/>
      </g>
      <text class="sans" x="870" y="104" font-size="13" font-weight="600" fill="#fff">9:41</text>
      <rect x="966" y="88" width="62" height="20" rx="10" fill="#000"/>
      <text class="sans" x="870" y="160" font-size="30" font-weight="800" letter-spacing="-1" fill="#fff">Bloqueio</text>

      <!-- Anel duplo -->
      <g transform="translate(996 268) rotate(-90)">
        <circle r="95" fill="none" stroke="#FF375F" stroke-opacity=".22" stroke-width="22"/>
        <circle class="ring-s" r="95" fill="none" stroke="#FF375F" stroke-width="22" stroke-linecap="round"/>
        <circle r="72" fill="none" stroke="#5E5CE6" stroke-opacity=".25" stroke-width="22"/>
        <circle class="ring-g" r="72" fill="none" stroke="#5E5CE6" stroke-width="22" stroke-linecap="round"/>
      </g>

      <g class="sans">
        <circle cx="878" cy="408" r="6" fill="#FF375F"/>
        <text x="892" y="404" font-size="12" fill="#fff" fill-opacity=".6">Redes sociais</text>
        <text x="892" y="428" font-size="22" font-weight="700" fill="#fff" style="font-variant-numeric: tabular-nums">12:34</text>
        <circle cx="1010" cy="408" r="6" fill="#5E5CE6"/>
        <text x="1024" y="404" font-size="12" fill="#fff" fill-opacity=".6">Jogos</text>
        <text x="1024" y="428" font-size="22" font-weight="700" fill="#fff" style="font-variant-numeric: tabular-nums">08:10</text>
      </g>

      <!-- Cartão de foco (vidro) -->
      <rect x="862" y="452" width="268" height="72" rx="20" fill="url(#glass)" stroke="url(#edge)"/>
      <g class="sans">
        <circle cx="894" cy="488" r="16" fill="#BF5AF2"/>
        <path d="M887 488h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <text x="920" y="482" font-size="15" font-weight="700" fill="#fff">Foco total</text>
        <text x="920" y="502" font-size="12" fill="#fff" fill-opacity=".6">Começar · 30 min</text>
      </g>
      <!-- Barra de abas de vidro -->
      <rect x="878" y="540" width="236" height="38" rx="19" fill="url(#glass)" stroke="url(#edge)"/>
      <rect x="884" y="545" width="66" height="28" rx="14" fill="#fff" fill-opacity=".14"/>
      <g fill="#fff">
        <circle cx="917" cy="559" r="5"/>
        <circle cx="976" cy="559" r="4" opacity=".5"/>
        <circle cx="1024" cy="559" r="4" opacity=".5"/>
        <circle cx="1072" cy="559" r="4" opacity=".5"/>
      </g>
      <rect class="shine" x="846" y="70" width="140" height="520" fill="url(#sheen)" transform="skewX(-12)"/>
    </g>
  </g>
  </g>
</svg>
