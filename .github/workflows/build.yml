name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK em $ANDROID_HOME.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Chave fixa: Device Owner não pode ser reinstalado, então toda versão
      # precisa da mesma assinatura (ver docs/PADROES.md).
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.BLOQUEIO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bloqueio.p12"
            echo "BLOQUEIO_KEYSTORE=$RUNNER_TEMP/bloqueio.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem BLOQUEIO_KEYSTORE_B64: APK assinado com chave de debug temporária"
          fi

      - name: Testes e build
        env:
          BLOQUEIO_KEYSTORE_PASSWORD: ${{ secrets.BLOQUEIO_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk bloqueio-${GITHUB_REF_NAME//\//-}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bloqueio-apk
          path: bloqueio-*.apk

      # Nome fixo na Release: o link .../releases/latest/download/bloqueio.apk sempre
      # aponta para a versão mais nova (usado no README e no site).
      - name: Nome fixo para download
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp bloqueio-${GITHUB_REF_NAME}.apk bloqueio.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bloqueio.apk
            bloqueio-*.apk
          body_path: .github/RELEASE_NOTES.md
